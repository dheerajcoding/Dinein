services:
  # ── Backend: Node.js Web Service ──────────────────────────────────────────
  - type: web
    name: dinein-api
    runtime: node
    rootDir: server-node
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: dinein
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: RENDER_EXTERNAL_URL
        value: https://dinein-api.onrender.com
