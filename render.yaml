services:
  # ── Backend: Node.js Web Service ──────────────────────────────────────────
  - type: web
    name: dinein-api
    runtime: node
    rootDir: server-node
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    envVars:
      - key: MONGODB_URI
        sync: false          # You will paste this in the Render dashboard
      - key: MONGODB_DB_NAME
        value: dinein
      - key: JWT_SECRET_KEY
        generateValue: true  # Render auto-generates a secure secret
      - key: NODE_ENV
        value: production
      - key: RENDER_EXTERNAL_URL
        value: https://dinein-api.onrender.com

  # ── Frontend: Static Site (instant load, no cold start) ───────────────────
  - type: static
    name: dinein-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    pullRequestPreviewsEnabled: false
    envVars:
      - key: REACT_APP_API_URL
        value: https://dinein-api.onrender.com
      - key: NODE_NO_WARNINGS
        value: "1"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
